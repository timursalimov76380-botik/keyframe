<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keyframe · песочница формы</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/styles/lab.css" />
  </head>
  <body>
    <div class="lab">
      <header class="lab__head">
        <div>
          <span class="label">Песочница</span>
          <h1 class="lab__title">Восемь силуэтов</h1>
        </div>
        <p class="lab__warn">
          Отдельная страница, на сайт она не влияет и в сборку не попадает — Vite собирает
          только <code>index.html</code>. Выбери вариант, докрути ползунками, скажи какой —
          перенесу в хиро.
        </p>
      </header>

      <div class="stage">
        <div class="stage__wordmark" id="wordmark">
          <span>KEY</span><i class="stage__gap"></i><span>FRAME</span>
        </div>
        <canvas class="stage__canvas" id="stage-canvas"></canvas>
        <div class="stage__label">
          <strong class="stage__name" id="variant-name"></strong>
          <span class="stage__note" id="variant-note"></span>
        </div>
      </div>

      <div class="controls">
        <div class="control">
          <span class="control__top">
            Амплитуда <span class="control__value" data-for="amp"></span>
          </span>
          <input type="range" id="amp" data-param="amp" min="0.1" max="2.2" step="0.05" value="1" />
        </div>

        <div class="control">
          <span class="control__top">
            Частота <span class="control__value" data-for="freq"></span>
          </span>
          <input type="range" id="freq" data-param="freq" min="0.5" max="3.4" step="0.05" value="1.45" />
        </div>

        <div class="control">
          <span class="control__top">
            Скорость <span class="control__value" data-for="speed"></span>
          </span>
          <input type="range" id="speed" data-param="speed" min="0" max="0.6" step="0.01" value="0.14" />
        </div>

        <div class="control">
          <span class="control__top">
            Свечение <span class="control__value" data-for="bloom"></span>
          </span>
          <input type="range" id="bloom" data-param="bloom" min="0" max="2.6" step="0.05" value="1.25" />
        </div>

        <div class="control control--actions">
          <button class="btn btn--ghost btn--sm" type="button" id="play">Пауза</button>
          <button class="btn btn--ghost btn--sm" type="button" id="reset">Сброс</button>
          <label class="control__check">
            <input type="checkbox" id="context" checked />
            Показывать слово
          </label>
        </div>
      </div>

      <div class="thumbs" id="thumbs"></div>
    </div>

    <script type="module" src="/src/lab/lab.js"></script>
  </body>
</html>
